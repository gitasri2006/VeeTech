apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-agent-deployments
  namespace: discovery
  labels:
    app.kubernetes.io/name: discovery
    app.kubernetes.io/part-of: discovery-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: discovery-core
  template:
    metadata:
      labels:
        app: discovery-core
    spec:
      containers:
        - name: extraction-service
          image: gcr.io/discovery-prod/extraction:v1.0.0
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          envFrom:
            - secretRef:
                name: discovery-secrets
            - configMapRef:
                name: discovery-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: discovery-gateway-svc
  namespace: discovery
spec:
  type: ClusterIP
  selector:
    app: discovery-core
  ports:
    - name: extraction
      port: 8000
      targetPort: 8000
    - name: filtering
      port: 8001
      targetPort: 8001
    - name: entity-profile
      port: 8002
      targetPort: 8002
    - name: contextual-validation
      port: 8003
      targetPort: 8003
    - name: global-discovery
      port: 8004
      targetPort: 8004
    - name: multilingual
      port: 8005
      targetPort: 8005
    - name: fact-checking
      port: 8006
      targetPort: 8006
    - name: source-intelligence
      port: 8007
      targetPort: 8007
    - name: whatsapp-bot
      port: 8008
      targetPort: 8008
    - name: brief-clustering
      port: 8009
      targetPort: 8009

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: discovery-agents-hpa
  namespace: discovery
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: discovery-agent-deployments
  minReplicas: 3
  maxReplicas: 25
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: External
      external:
        metric:
          name: redis_streams_consumer_lag
        target:
          type: Value
          averageValue: "50"
